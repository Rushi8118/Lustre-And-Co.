<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lustre & Co. — modern imitation jewelry for everyday elegance and special occasions."
    />
    <meta name="theme-color" content="#fffdf8" />
    <link rel="canonical" href="https://lustre-and-co.vercel.app/" />

    <!-- Link previews (WhatsApp, Instagram, Facebook, Slack, iMessage).
         Crawlers do not run JavaScript, so these must be in the HTML itself.
         Product links are given their own tags by /api/og. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lustre &amp; Co." />
    <meta property="og:title" content="Lustre &amp; Co. | Everyday elegance, made to shine" />
    <meta
      property="og:description"
      content="Gold-plated necklaces, earrings, rings, bracelets, and bridal jewelry — hypoallergenic, and made to last."
    />
    <meta property="og:url" content="https://lustre-and-co.vercel.app/" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1601121141461-9d6647bca1ed?auto=format&fit=crop&w=1200&h=630&q=80"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gold-plated jewelry from Lustre & Co." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lustre &amp; Co. | Everyday elegance, made to shine" />
    <meta
      name="twitter:description"
      content="Gold-plated necklaces, earrings, rings, bracelets, and bridal jewelry — hypoallergenic, and made to last."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1601121141461-9d6647bca1ed?auto=format&fit=crop&w=1200&h=630&q=80"
    />

    <!-- Open connections early: the API and product images are needed on first render. -->
    <link rel="preconnect" href="https://lustre-and-co.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://lustre-and-co.onrender.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>Lustre & Co. | Everyday elegance, made to shine</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
