name: Keep API awake

# Render's free plan sleeps a service after 15 minutes without traffic.
# Pinging it regularly avoids the slow cold start for visitors.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -fsS --retry 5 --retry-delay 10 --max-time 90 https://lustre-and-co.onrender.com/api/settings -o /dev/null
