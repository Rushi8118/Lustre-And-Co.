name: Store jobs

# The free hosting plan sleeps an idle server, so scheduled work is triggered
# from here instead of a timer inside the app.
# Needs a repository secret named JOB_SECRET, matching the server's JOB_SECRET.
on:
  schedule:
    # Abandoned-cart reminders: hourly at :23.
    - cron: "23 * * * *"
    # Low-stock digest: once a day at 03:40 UTC (09:10 IST).
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: abandoned-carts
        type: choice
        options:
          - abandoned-carts
          - low-stock-digest

env:
  API: https://lustre-and-co.onrender.com/api

jobs:
  abandoned-carts:
    if: github.event.schedule == '23 * * * *' || github.event.inputs.job == 'abandoned-carts'
    runs-on: ubuntu-latest
    steps:
      - name: Send abandoned cart reminders
        run: |
          # Not an error: the store simply has not been set up for jobs yet.
          # Failing here would email a failure every hour for a feature that is
          # not switched on. Once the secret exists, real problems still fail.
          if [ -z "${{ secrets.JOB_SECRET }}" ]; then
            echo "::warning::Skipped: the JOB_SECRET repository secret is not set."
            echo "To switch these reminders on, set JOB_SECRET in the hosting"
            echo "environment variables, then add the same value under"
            echo "Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          # The server explains refusals in the response body, so print it
          # instead of letting curl -f swallow the reason.
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "$API/jobs/abandoned-carts" \
            -H "x-job-secret: ${{ secrets.JOB_SECRET }}" \
            --retry 5 --retry-delay 15 --retry-connrefused --max-time 120)
          echo "HTTP $code"
          cat response.txt
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Abandoned cart job failed with HTTP $code (see the response above)."
            exit 1
          fi

  low-stock-digest:
    if: github.event.schedule == '40 3 * * *' || github.event.inputs.job == 'low-stock-digest'
    runs-on: ubuntu-latest
    steps:
      - name: Send low stock digest
        run: |
          # Not an error: the store simply has not been set up for jobs yet.
          # Failing here would email a failure every hour for a feature that is
          # not switched on. Once the secret exists, real problems still fail.
          if [ -z "${{ secrets.JOB_SECRET }}" ]; then
            echo "::warning::Skipped: the JOB_SECRET repository secret is not set."
            echo "To switch these reminders on, set JOB_SECRET in the hosting"
            echo "environment variables, then add the same value under"
            echo "Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "$API/jobs/low-stock-digest" \
            -H "x-job-secret: ${{ secrets.JOB_SECRET }}" \
            --retry 5 --retry-delay 15 --retry-connrefused --max-time 120)
          echo "HTTP $code"
          cat response.txt
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Low stock digest failed with HTTP $code (see the response above)."
            exit 1
          fi
